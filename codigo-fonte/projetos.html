  <body>
    <header id="site-header"></header>

    <main id="conteudo" class="main-content">
      <section class="page-hero" aria-labelledby="page-title">
          <svg class="page-hero__grid malha" data-efeito="grade" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="malha-pagina" width="56" height="97" patternUnits="userSpaceOnUse">
                <path class="crease-m" d="M0 0 L56 97" />
                <path class="crease-v" d="M56 0 L0 97" />
                <path class="crease-h" d="M0 48.5 H56" />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#malha-pagina)" />
          </svg>
          <div class="page-hero__glow" data-efeito="glow" aria-hidden="true"></div>
          <svg class="page-hero__fold" data-efeito="parallax" viewBox="0 0 270 170" aria-hidden="true" focusable="false">
            <path class="face-m" d="M0 30 L80 10 L110 80 L30 100 Z" />
            <path class="face-v" d="M80 10 L160 30 L190 100 L110 80 Z" />
            <path class="face-m" d="M160 30 L240 10 L270 80 L190 100 Z" />
            <path class="face-v" d="M30 100 L110 80 L80 150 L0 170 Z" />
            <path class="face-m" d="M110 80 L190 100 L160 170 L80 150 Z" />
            <path class="face-v" d="M190 100 L270 80 L240 150 L160 170 Z" />
            <path class="face-f" d="M110 80 L124 88 L106 92 Z" />
          </svg>
          <div class="page-hero__inner">
              <h1 id="page-title" class="page-hero__title">Projetos</h1>
              <p class="page-hero__lede">Todo o acervo de ADS da PUC Minas. Filtre por área, ano ou autor e abra a ficha de cada projeto.</p>
              <div class="spec-plate" data-efeito="vidro"><dl class="spec-plate__list"><div><dt>Resultados</dt><dd class="num"><span data-plate="total">—</span></dd></div><div><dt>Página</dt><dd class="num"><span data-plate="pagina">—</span></dd></div><div><dt>Por página</dt><dd class="num">20</dd></div></dl></div>
          </div>
        </section>

      <div class="page-body listagem">
        <aside class="sidebar-filter panel" aria-labelledby="filtro-titulo" data-reveal>
          <h2 id="filtro-titulo" class="panel__title">Filtrar</h2>

          <form class="filter-form" method="GET" role="search">
            <div class="field">
              <label for="filtro-busca">Buscar</label>
              <input id="filtro-busca" type="search" name="search" class="filter-form__input" placeholder="Projetos, autores..." />
            </div>

            <div class="field">
              <label for="filtro-campo">Buscar em</label>
              <select id="filtro-campo" class="filter-form__select" name="searchBy">
                <option value="">Todos</option>
                <option value="title">Título</option>
                <option value="author">Autor</option>
              </select>
            </div>

            <div class="field">
              <label for="filtro-ordem">Ordenar por</label>
              <select id="filtro-ordem" class="filter-form__select" name="orderBy">
                <option value="">Relevância</option>
                <option value="newest">Mais Recente</option>
                <option value="oldest">Mais Antigo</option>
                <option value="citations">Mais Citados</option>
              </select>
            </div>

            <div class="field">
              <label for="filtro-ano">Ano</label>
              <select id="filtro-ano" class="filter-form__select" name="year">
                <option value="">Todos os anos</option>
              </select>
            </div>

            <div class="field">
              <label for="filtro-area">Área de atuação</label>
              <select id="filtro-area" class="filter-form__select" name="area">
                <option value="">Todas as áreas</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="mobile">Mobile</option>
                <option value="redes">Redes</option>
                <option value="banco-dados">Banco de Dados</option>
                <option value="seguranca">Segurança da Informação</option>
              </select>
            </div>

            <div class="filter-form__actions">
              <button type="submit" class="filter-form__button btn-ink">Buscar</button>
              <button type="reset" class="filter-form__button filter-form__button--reset link-arrow">Limpar</button>
            </div>
          </form>
        </aside>

        <section class="projects" aria-labelledby="resultados-titulo">
          <div class="projects__header">
            <h2 id="resultados-titulo" class="projects__title">Acervo</h2>
            <p class="acervo__count" aria-live="polite">Resultados: <strong class="num">0</strong></p>
          </div>

          <div class="projects-list projetos-lista"></div>

          <nav class="pagination" aria-label="Páginas de resultados"></nav>
        </section>
      </div>
    </main>

        <footer id="site-footer"></footer>
