      <div class="page-body form-layout">
        <section class="panel" aria-labelledby="mensagem-titulo" data-reveal>
          <h2 id="mensagem-titulo" class="panel__title">Mensagem</h2>
          <form id="contactForm" class="contact-form form-grid" novalidate>
              <div class="field field--half">
                <label for="name">Seu Nome <span class="field__required" aria-hidden="true">*</span></label>
                <input type="text" id="name" name="name" placeholder="Digite seu nome completo" autocomplete="name" required />
              </div>
              <div class="field field--half">
                <label for="email">Seu E-mail <span class="field__required" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" autocomplete="email" required />
              </div>
              <div class="field">
                <label for="subject">Assunto <span class="field__required" aria-hidden="true">*</span></label>
                <input type="text" id="subject" name="subject" placeholder="Sobre o que você gostaria de falar?" required />
              </div>
              <div class="field">
                <label for="message">Sua Mensagem <span class="field__required" aria-hidden="true">*</span></label>
                <textarea id="message" name="message" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>
              </div>
              <p id="form-feedback" class="form-feedback form-status" role="status" aria-live="polite"></p>
              <div class="form-actions">
                <button type="submit" class="btn-ink submit-button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg> Enviar Mensagem</button>

          </form>

            <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span><strong>Telefone</strong> (31) 99999-9999</span></li>
